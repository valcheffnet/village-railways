plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
}

base {
	archivesName = 'village-railways'
}

repositories {
	maven {
		name = 'TerraformersMC'
		url = 'https://maven.terraformersmc.com/releases/'
	}
}

loom {
	// The common code runs on dedicated servers too, so only the client source set may use client classes.
	splitEnvironmentSourceSets()

	mods {
		"village_railways" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	// 1.21.11 is the last obfuscated release: Mojang's own names, as the newer versions have them built in.
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Optional: Mod Menu shows the config screen button. Not bundled, not required.
	modClientCompileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
	modLocalRuntime "com.terraformersmc:modmenu:${project.modmenu_version}"

	testImplementation "org.junit.jupiter:junit-jupiter:${project.junit_version}"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

def templateProps = [
	version          : project.version,
	minecraft_version: project.minecraft_version,
	java_version     : project.java_version,
]

processResources {
	inputs.properties templateProps
	filesMatching("fabric.mod.json") {
		expand templateProps
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = 'UTF-8'
	it.options.release = project.java_version as int
}

tasks.withType(Test).configureEach {
	useJUnitPlatform()
}

java {
	sourceCompatibility = JavaVersion.toVersion(project.java_version)
	targetCompatibility = JavaVersion.toVersion(project.java_version)
	withSourcesJar()
}
